
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Receipt | Finance Manager</title>
</head>
<body>
    <h1>Upload a receipt</h1>
    <p><a href="{{ url_for('index') }}">Back to dashboard</a></p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p><strong>{{ category|title }}:</strong> {{ message }}</p>
    {% endfor %}

    <form method="POST" enctype="multipart/form-data">
        <label for="receipt">Choose a receipt (PDF, PNG, JPG, or WEBP)</label>
        <input
            type="file"
            id="receipt"
            name="receipt"
            accept=".pdf,.png,.jpg,.jpeg,.webp"
            required
        >
        <button type="submit">Upload and analyze</button>
    </form>
</body>
</html>
